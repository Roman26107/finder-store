<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Восстановление доступа к FINDER</title>
</head>
<body style="margin:0;padding:0;background:#e3e4e1;color:#242524;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#e3e4e1;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#f0f1ee;border:1px solid #c3c5c2;">
                    <tr>
                        <td style="padding:30px 32px 12px;font-family:Georgia,serif;font-size:24px;letter-spacing:7px;">FINDER</td>
                    </tr>
                    <tr>
                        <td style="padding:18px 32px 32px;">
                            <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:26px;font-weight:500;line-height:1.25;">Восстановление доступа</h1>
                            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;">Мы получили запрос на восстановление пароля для аккаунта FINDER, связанного с этим e-mail.</p>
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td style="background:#242524;">
                                        <a href="{{ protocol }}://{{ domain }}{% url 'shop:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:14px 22px;color:#ffffff;font-size:13px;font-weight:600;text-decoration:none;">Создать новый пароль</a>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:24px 0 0;color:#555957;font-size:13px;line-height:1.6;">Ссылка одноразовая и действует ограниченное время. Если вы не запрашивали восстановление, просто проигнорируйте это письмо — пароль останется прежним.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
