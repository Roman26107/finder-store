# Общий L7-периметр для динамических запросов. Пустой ключ search_limit_key
# не учитывается Nginx, поэтому search_limit срабатывает только на витринах каталога.
limit_req zone=site_per_ip burst=40 nodelay;
limit_req zone=site_total burst=200 nodelay;
limit_req zone=search_limit burst=10 nodelay;
limit_conn conn_per_ip 20;

proxy_pass http://finder_web;
include /etc/nginx/finder-templates/proxy-headers.conf;